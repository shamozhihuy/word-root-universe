          "小学": "小学基础词汇",
          "初中": "初中核心词汇",
          "高中": "高中核心词汇",
          "A级": "高职高专应用能力考试",
          "CET-4": "大学英语四级",
          "CET-6": "大学英语六级",
          "考研": "考研英语一/二",
          "雅思": "IELTS 学术类",
          "托福": "TOEFL iBT",
          "常用": "高频常用词汇",
          "自定义": "个人词库与兴趣学习"
        };
        return map[exam] || "学习目标";
      }

      function bindAssessmentStep(step) {
        if (step === 0) {
          document.getElementById("assessmentSkip").onclick = skipAssessment;
          document.getElementById("assessmentNext").onclick = function () {
            renderAssessmentStep(1);
          };
          return;
        }
        if (step === 1) {
          const options = document.querySelectorAll("#assessmentExamOptions .assessment-option");
          options.forEach(function (button) {
            button.onclick = function () {
              options.forEach(function (item) { item.classList.remove("selected"); });
              button.classList.add("selected");
              assessmentSession.targetExam = button.dataset.exam;
            };
          });
          document.querySelector("[data-assessment-back]").onclick = function () {
            renderAssessmentStep(0);
          };
          document.getElementById("assessmentExamNext").onclick = function () {
            if (!assessmentSession.targetExam) {
              showToast("请先选择一个目标");
              return;
            }
            renderAssessmentStep(2);
          };
          return;
        }
        if (step === 2) {
          const options = document.querySelectorAll("#assessmentLevelOptions .assessment-option");
          options.forEach(function (button) {
            button.onclick = function () {
              options.forEach(function (item) { item.classList.remove("selected"); });
              button.classList.add("selected");
              assessmentSession.selfLevel = button.dataset.level;
            };
          });
          document.querySelector("[data-assessment-back]").onclick = function () {
            renderAssessmentStep(1);
          };
          document.getElementById("assessmentLevelNext").onclick = function () {
            if (!assessmentSession.selfLevel) {
              showToast("请先选择你的水平");
              return;
            }
            assessmentSession.questions = getAssessmentQuestions();
            assessmentSession.quizIndex = 0;
            assessmentSession.quizScore = 0;
            renderAssessmentStep(3);
          };
          return;
        }
        if (step === 3) {
          document.querySelectorAll("#assessmentQuizOptions .assessment-option").forEach(function (button) {
            button.onclick = function () {
              handleAssessmentQuizAnswer(Number(button.dataset.option));
            };
          });
          return;
        }
        if (step === 4) {
          document.querySelectorAll("[data-skill]").forEach(function (input) {
            input.onchange = function () {
              const skill = input.dataset.skill;
              const index = assessmentSession.weakSkills.indexOf(skill);
              if (input.checked && index === -1) {
                assessmentSession.weakSkills.push(skill);
              } else if (!input.checked && index !== -1) {
                assessmentSession.weakSkills.splice(index, 1);
              }
            };
          });
          document.querySelectorAll("#assessmentConfidence [data-confidence]").forEach(function (button) {
            button.onclick = function () {
              assessmentSession.confidence = Number(button.dataset.confidence);
              document.querySelectorAll("#assessmentConfidence [data-confidence]").forEach(function (item) {
                item.classList.toggle("selected", item === button);
              });
            };
          });
          document.querySelector("[data-assessment-back]").onclick = function () {
            renderAssessmentStep(2);
          };
          document.getElementById("assessmentFinish").onclick = function () {
            renderAssessmentStep(5);
          };
          return;
        }
        document.getElementById("assessmentRetake").onclick = function () {
          openAssessment();
        };
        document.getElementById("assessmentEnter").onclick = finishAssessment;
      }

      function getAssessmentQuestions() {
        const pool = shuffle(getAssessmentWordPool(assessmentSession.selfLevel)).filter(function (word) {
          return word.word && word.word.length >= 3 && word.definitionCn && word.definitionCn !== "暂无释义";
        }).slice(0, 24);
        const questions = pool.slice(0, 5).map(function (correctWord) {
          const distractors = shuffle(pool.filter(function (word) {
            return word.id !== correctWord.id && word.definitionCn && word.definitionCn !== correctWord.definitionCn;
          })).slice(0, 3).map(function (word) { return word.definitionCn; });
          const options = shuffle([correctWord.definitionCn].concat(distractors));
          return {
            word: correctWord,
            options: options,
            correctIndex: options.indexOf(correctWord.definitionCn),
            selectedIndex: null,
            answered: false
          };
        });
        return questions;
      }

      function getAssessmentWordPool(level) {
        const examMap = {
          A1: ["小学"],
          A2: ["小学", "A级"],
          B1: ["初中", "高中", "CET-4"],
          B2: ["高中", "CET-6", "考研", "雅思"],
          C1: ["CET-6", "雅思", "托福"],
          C2: ["CET-6", "托福"],
          unknown: []
        };
        const exams = examMap[level] || [];
        if (!exams.length) {
          return allWords();
        }
        return allWords().filter(function (word) {
          return word.examTypes.some(function (exam) {
            return exams.indexOf(exam) !== -1;
          });
        });
      }

      function handleAssessmentQuizAnswer(selectedIndex) {
        const question = assessmentSession.questions[assessmentSession.quizIndex];
        if (!question || question.answered) {
          return;
        }
        question.answered = true;
        question.selectedIndex = selectedIndex;
        const correct = selectedIndex === question.correctIndex;
        if (correct) {
          assessmentSession.quizScore += 1;
        }
        const buttons = document.querySelectorAll("#assessmentQuizOptions .assessment-option");
        buttons[question.correctIndex].classList.add("correct");
        if (!correct) {
          buttons[selectedIndex].classList.add("wrong");
        }
        buttons.forEach(function (button) { button.disabled = true; });
        const feedback = document.getElementById("assessmentQuizFeedback");
        if (feedback) {
          feedback.textContent = correct ? "回答正确" : "没关系，测试就是为了找到你的真实起点。";
          feedback.className = "feedback " + (correct ? "correct" : "wrong");
        }
        window.setTimeout(function () {
          if (assessmentSession.quizIndex < assessmentSession.questions.length - 1) {
            assessmentSession.quizIndex += 1;
            renderAssessmentStep(3);
          } else {
            renderAssessmentStep(4);
          }
        }, 700);
      }

      function getEstimatedLevel(score, selfLevel) {
        const ranks = { A1: 1, A2: 2, B1: 3, B2: 4, C1: 5, C2: 6, unknown: 3 };
        let rank = ranks[selfLevel] || 3;
        if (score >= 4) {
          rank += 1;
        } else if (score <= 2) {
          rank -= 1;
        }
        rank = Math.max(1, Math.min(6, rank));
        return ["A1", "A2", "B1", "B2", "C1", "C2"][rank - 1];
      }

      function getRecommendedDailyGoal(level) {
        return { A1: 10, A2: 15, B1: 25, B2: 35, C1: 45, C2: 50 }[level] || 30;
      }

      function buildAssessmentAdvice(level) {
        const map = {
          "A1": "从最基础的高频词和自然拼读开始，先建立每天稳定输入，再进入简单跟读。",
          "A2": "从高频基础词和发音开始，先建立稳定输入，再进入口语跟读。",
          "B1": "以四级核心词为主，重点补词根拆解和听音辨义。",
          "B2": "适合进入考研/雅思训练，把单词放到阅读和口语语境中输出。",
          "C1": "减少机械背词，多练同义替换、学术搭配和口语成段表达。",
          "C2": "重点提升语域、搭配和表达精度，多进行高级阅读与即兴口语训练。"
        };
        return map[level] || map.B1;
      }

      function getAssessmentSummary() {

        }
        if (state.assessment.skipped) {

          "；估算水平：" + state.assessment.estimatedLevel +
          "；快速检测：" + state.assessment.quizScore + "/" + state.assessment.quizTotal +
          "；薄弱项：" + (state.assessment.weakSkills.length ? state.assessment.weakSkills.join("、") : "无明显偏好") +
          "；建议目标：" + state.assessment.dailyGoal + " 词/天";
      }

      function finishAssessment() {
        const level = getEstimatedLevel(assessmentSession.quizScore, assessmentSession.selfLevel);
        const dailyGoal = getRecommendedDailyGoal(level);
        state.assessment = {
          skipped: false,
          doneAt: Date.now(),
          targetExam: assessmentSession.targetExam || state.currentExam,
          selfLevel: assessmentSession.selfLevel || "B1",
          estimatedLevel: level,
          quizScore: assessmentSession.quizScore,
          quizTotal: assessmentSession.questions.length,
          confidence: assessmentSession.confidence,
          weakSkills: assessmentSession.weakSkills.slice(),
          dailyGoal: dailyGoal
        };
        state.currentExam = state.assessment.targetExam;
        state.settings.dailyGoal = dailyGoal;
        state.mode = "teacher";
        persist();
        closeAssessment();

      function bindSpellingEvents() {
        const input = document.getElementById("spellInput");
        const hint = document.getElementById("spellHint");
        const mask = document.getElementById("wordMask");
        const checkBtn = document.getElementById("spellCheck");
        const skipBtn = document.getElementById("spellSkip");
        const rootToggle = document.getElementById("rootHintToggle");
        if (!input || !checkBtn) {
          return;
        }
        input.oninput = function () {
          const word = currentWord();
          if (!word) {
            return;
          }
          const value = input.value.replace(/[^a-zA-Z]/g, "").slice(0, word.word.length);
          input.value = value;
          mask.innerHTML = renderMask(word.word, value);
          if (value.length === word.word.length) {
            if (value.toLowerCase() === word.word.toLowerCase()) {
              handleSpellCorrect(word, input, hint, mask);
            } else {
              handleSpellWrong(word, hint);
            }
          } else {
            hint.textContent = "连续答对 3 次会标记为“已掌握”";
            hint.className = "hint";
          }
        };
        input.onkeydown = function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            checkSpell(input, hint, mask);
          }
        };
        checkBtn.onclick = function () { checkSpell(input, hint, mask); };
        skipBtn.onclick = function () {
          const word = currentWord();
          if (word) {
            addMistake(state.currentExam, word.id);
            recordAttempt(state.currentExam, false);
            session.streak = 0;
            advanceSpell(1000);
            showToast("已记入错题本：" + word.word);
          }
        };
        if (rootToggle) {
          rootToggle.onchange = function () {
            state.settings.rootHint = rootToggle.checked;
            persist();
          };
        }
      }

      function checkSpell(input, hint, mask) {
        const word = currentWord();
        if (!word) {
          return;
        }
        const value = input.value.trim();
        if (!value) {
          hint.textContent = "请输入单词后再检查";
          hint.className = "hint wrong";
          return;
        }
        if (value.toLowerCase() === word.word.toLowerCase()) {
          handleSpellCorrect(word, input, hint, mask);
        } else {
          handleSpellWrong(word, hint);
        }
      }

      function handleSpellCorrect(word, input, hint, mask) {
        if (session.attempted) {
          return;
        }
        session.attempted = true;
        recordAttempt(state.currentExam, true);
        session.streak += 1;
        const progress = ensureProgress(state.currentExam);
        if (session.streak >= 3) {
          if (progress.mastered.indexOf(word.id) === -1) {
            progress.mastered.push(word.id);
          }
          progress.learnedAt[word.id] = progress.learnedAt[word.id] || Date.now();
          hint.textContent = "拼写正确！连续答对 " + session.streak + " 次，已标记为“已掌握”";
          hint.className = "hint success";
          showToast("已掌握：" + word.word);
        } else {
          hint.textContent = "拼写正确！连续答对 " + session.streak + " 次，再答对 " + (3 - session.streak) + " 次即掌握";
          hint.className = "hint success";
        }
        persist();
        advanceSpell(900);
      }

      function handleSpellWrong(word, hint) {
        if (session.attempted) {
          return;
        }
        session.attempted = true;
        session.streak = 0;
        recordAttempt(state.currentExam, false);
        addMistake(state.currentExam, word.id);
        const missing = word.word.split("").find(function (char) { return /[a-z]/.test(char); });
        let message = "单词中包含字母 " + (missing ? missing.toUpperCase() : "?") + "，长度为 " + word.word.length + "。";
        if (state.settings.rootHint && word.rootAffix && word.rootAffix.root) {
          message += " 词根拆解：" + word.rootAffix.affix + " + " + word.rootAffix.root + "（" + word.rootAffix.meaning + "）";
        }
        hint.textContent = message;
        hint.className = "hint wrong";
        persist();
        window.setTimeout(function () {
          session.attempted = false;
          render();
        }, 1800);
      }

      function advanceSpell(delay) {
        window.setTimeout(function () {
          if (session.queue.length) {
            session.index = (session.index + 1) % session.queue.length;
            session.flipped = false;
            session.attempted = false;
            render();
          }
        }, delay);
      }

      function startSpeechPractice(word) {
        const transcript = document.getElementById("speakTranscript");
        const score = document.getElementById("speakScore");
        const audioBox = document.getElementById("speakAudio");
        stopSpeechPractice();
        if (transcript) {
          transcript.textContent = "正在聆听，请大声读出这个单词…";
          transcript.className = "speak-transcript";
        }
        if (score) {
          score.innerHTML = "";
        }
        if (audioBox) {
          audioBox.innerHTML = "";
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition && !(navigator.mediaDevices && window.MediaRecorder)) {
          if (transcript) {
            transcript.textContent = "当前浏览器不支持语音识别或录音，请使用最新版 Edge 或 Chrome。";
          }
          return;
        }
        if (SpeechRecognition) {
          speechRecognition = new SpeechRecognition();
          speechRecognition.lang = "en-US";
          speechRecognition.interimResults = false;
          speechRecognition.maxAlternatives = 3;
          speechRecognition.onresult = function (event) {
            const results = Array.prototype.slice.call(event.results || []).filter(function (result) { return result.isFinal; });
            const alternatives = results.reduce(function (list, result) {
              for (let i = 0; i < result.length; i += 1) {
                list.push(result[i].transcript);
              }
              return list;
            }, []);
            finishSpeechPractice(word, alternatives);
          };
          speechRecognition.onerror = function (event) {
            finishSpeechPractice(word, []);
            showToast("语音识别失败：" + (event.error || "未知错误"));
          };
          speechRecognition.onend = function () {
            if (!session.speechTranscript && transcript) {
              transcript.textContent = "没有识别到有效语音，请再试一次。";
            }
          };
          speechRecognition.start();
        }

        if (navigator.mediaDevices && window.MediaRecorder) {
          recordedChunks = [];
          recordedAudioUrl = null;
          navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = function (event) {
              if (event.data && event.data.size) {
                recordedChunks.push(event.data);
              }
            };
            mediaRecorder.onstop = function () {
              const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
              if (blob.size) {
                recordedAudioUrl = URL.createObjectURL(blob);
                const box = document.getElementById("speakAudio");
                if (box) {
                  box.innerHTML = '<audio controls src="' + escapeAttr(recordedAudioUrl) + '"></audio>';
                }
              }
              stream.getTracks().forEach(function (track) { track.stop(); });
            };
            mediaRecorder.start();
          }).catch(function () {
            showToast("无法访问麦克风，仍会尝试语音识别");
          });
        }
      }

      function stopSpeechPractice() {
        if (speechRecognition) {
          try {
            speechRecognition.stop();
          } catch (error) {
            // Ignore stop errors when recognition has already ended.
          }
          speechRecognition = null;
        }
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
      }

      function finishSpeechPractice(word, alternatives) {
        const transcriptEl = document.getElementById("speakTranscript");
        const scoreEl = document.getElementById("speakScore");
        const transcript = alternatives.length ? alternatives[0] : "";
        session.speechTranscript = transcript;
        if (transcriptEl) {
          transcriptEl.textContent = transcript || "没有识别到有效语音，请再试一次。";
          transcriptEl.className = "speak-transcript" + (transcript ? "" : " wrong");
        }
        stopSpeechPractice();
        if (!transcript) {
          if (scoreEl) {
            scoreEl.innerHTML = "";
          }
          return;
        }
        const result = scoreSpeech(word, transcript, alternatives);
        const isCorrect = result.score >= 80;
        recordAttempt(state.currentExam, isCorrect, word.id, true);
        scheduleReview(state.currentExam, word.id, isCorrect ? "good" : "again");
        persist();
        if (scoreEl) {
          scoreEl.innerHTML = '<span>跟读得分</span><strong>' + result.score + '</strong><span>/100</span>';
        }
        showToast(result.score >= 80 ? "发音不错！" : "继续跟读，注意示范发音。");
      }

      function normalizeTranscript(value) {
        return String(value || "").toLowerCase().replace(/[^a-z\s'-]/g, " ").replace(/\s+/g, " ").trim();
      }

      function scoreSpeech(word, transcript, alternatives) {
        const target = normalizeTranscript(word.word);
        const candidates = [transcript].concat(alternatives || []).map(normalizeTranscript).filter(Boolean);
        let best = { score: 0, matched: "" };
        candidates.forEach(function (candidate) {
          const score = similarityScore(target, candidate);
          if (score > best.score) {
            best = { score: score, matched: candidate };
          }
        });
        return best;
      }

      function similarityScore(left, right) {
        if (!left || !right) {
          return 0;
        }
        const a = left.trim();
        const b = right.trim();
        const distance = levenshteinDistance(a, b);
        const maxLen = Math.max(a.length, b.length);
        const similarity = maxLen ? 1 - distance / maxLen : 1;
        const tokenScore = a.split(/\s+/).filter(function (token) {
          return b.split(/\s+/).indexOf(token) !== -1;
        }).length / Math.max(1, a.split(/\s+/).length);
        return Math.round(Math.max(similarity, tokenScore) * 100);
      }

      function levenshteinDistance(a, b) {
        const matrix = [];
        for (let i = 0; i <= b.length; i += 1) {
          matrix[i] = [i];
        }
        for (let j = 0; j <= a.length; j += 1) {
          matrix[0][j] = j;
        }
        for (let i = 1; i <= b.length; i += 1) {
          for (let j = 1; j <= a.length; j += 1) {
            matrix[i][j] = b.charAt(i - 1) === a.charAt(j - 1)
              ? matrix[i - 1][j - 1]
              : Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
          }
        }
        return matrix[b.length][a.length];
      }

      function parseUploadedFile() {
        const fileInput = document.getElementById("fileInput");
        const file = fileInput && fileInput.files && fileInput.files[0];
        if (!file) {
          showToast("请先选择文件");
          return;
        }
        const exam = document.getElementById("uploadExam").value;
        if ((file.type && file.type.indexOf("image/") === 0) || /\.(png|jpe?g|webp|gif)$/i.test(file.name)) {
          handleImageUpload(file, exam);
          return;
        }
        if (/\.json$/i.test(file.name) || file.type === "application/json") {
          handleJsonImport(file);
          return;
        }
        const reader = new FileReader();
        reader.onload = function () {
          const text = String(reader.result || "");
          const lines = text.split(/\r?\n/).map(function (line) { return line.trim(); }).filter(Boolean);
          if (!lines.length) {
            showToast("文件内容为空");
            return;
          }
          const isCsv = /\.csv$/i.test(file.name) || lines[0].indexOf(",") !== -1;
          const parsed = isCsv ? parseCsv(lines) : parseTxt(lines);
          if (!parsed.length) {
            showToast("没有解析到有效单词");
            return;
          }
          let imported = 0;
          parsed.forEach(function (row) {
            if (!row.word || !row.definition) {
              return;
            }
            const word = buildCustomWord(row, exam);
            const exists = allWords().some(function (item) { return item.word.toLowerCase() === word.word.toLowerCase() && item.examTypes.indexOf(exam) !== -1; });
            if (exists) {
              return;
            }
            state.customWords.push(word);
            imported += 1;
          });
          persist();
          closeModal();
          state.currentExam = exam;
          session = createSession();
          render();
          showToast("成功导入 " + imported + " 个单词到「" + exam + "」");
        };
        reader.readAsText(file, "utf-8");
      }

      function parseCsv(lines) {
        const rows = lines.map(parseCsvLine);
        const header = rows[0] || [];
        const map = {};
        header.forEach(function (name, index) {
          map[normalizeField(name)] = index;
        });
        return rows.slice(1).map(function (row) {
          return {
            word: getCell(row, map, ["word", "单词"]),
            phonetic: getCell(row, map, ["phonetic", "音标"]),
            definition: getCell(row, map, ["definition", "definition_cn", "释义"]),
            example: getCell(row, map, ["example", "example_sentence", "例句"]),
            root: getCell(row, map, ["root", "词根"]),
            meaning: getCell(row, map, ["meaning", "词根释义"]),
            affix: getCell(row, map, ["affix", "词缀"]),
            audioUrl: getCell(row, map, ["audio_url", "audiourl", "发音链接"]),
            imageData: getCell(row, map, ["image_data", "imagedata", "图片数据"]),
            imageUrl: getCell(row, map, ["image_url", "imageurl", "图片链接"])
          };
        });
      }

      function parseTxt(lines) {
        return lines.map(function (line) {
          const parts = line.split("|").map(function (part) { return part.trim(); });
          return {
            word: parts[0] || "",
            phonetic: parts[1] || "",
            definition: parts[2] || "",
            example: parts[3] || "",
            root: parts[4] || "",
            meaning: parts[5] || "",
            affix: parts[6] || "",
            audioUrl: parts[7] || "",
            imageData: parts[8] || "",
            imageUrl: parts[9] || ""
          };
        });
      }

      function normalizeField(value) {
        return String(value || "").trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, "");
      }

      function getCell(row, map, keys) {
        for (let i = 0; i < keys.length; i += 1) {
          const index = map[normalizeField(keys[i])];
          if (index !== undefined && row[index] != null && String(row[index]).trim()) {
            return String(row[index]).trim();
          }
        }
        return "";
      }

      function parseCsvLine(line) {
        const cells = [];
        let current = "";
        let quoted = false;
        for (let i = 0; i < line.length; i += 1) {
          const char = line[i];
          if (char === '"') {
            if (quoted && line[i + 1] === '"') {
              current += '"';
              i += 1;
            } else {
              quoted = !quoted;
            }
          } else if (char === "," && !quoted) {
            cells.push(current);
            current = "";
          } else {
            current += char;
          }
        }
        cells.push(current);
        return cells;
      }

      function buildCustomWord(row, exam) {
        const parts = [];
        if (row.affix) {
          row.affix.split(/[;；,，、]/).forEach(function (part) {
            const cleaned = part.trim();
            if (cleaned) {
              parts.push({ text: cleaned, type: "prefix", meaning: cleaned });
            }
          });
        }
        if (row.root) {
          parts.push({ text: row.root, type: "root", meaning: row.meaning || "词根" });
        }
        const word = row.word.toLowerCase();
        const roots = row.root ? [row.root] : [];
        if (!parts.length) {
          parts.push({ text: word, type: "root", meaning: row.meaning || "自定义词根" });
        }
        return {
          id: uid("custom"),
          word: word,
          phonetic: row.phonetic || "/" + word + "/",
          definitionCn: row.definition,
          exampleSentence: row.example || "（暂无例句）",
          examTypes: [exam],
          cefrLevel: "自定义",
          difficultyLevel: 2,
          audioUrl: row.audioUrl || "",
          parts: parts,
          roots: roots.length ? roots : [word],
          tags: ["自定义"],
          isCustom: true,
          imageData: row.imageData || row.imageUrl || "",
          imageName: row.imageName || "",
          rootAffix: {
            root: row.root || word,
            meaning: row.meaning || "自定义词根",
            affix: row.affix || ""
          }
        };
      }

      function handleImageUpload(file, exam) {
        const reader = new FileReader();
        reader.onload = function () {
          const stem = file.name.replace(/\.[^.]+$/, "").replace(/[^a-zA-Z0-9_-]/g, "-");
          const word = (document.getElementById("imageWord").value || "").trim() || stem || "image-word";
          const definition = (document.getElementById("imageDefinition").value || "").trim() || "图片视觉卡";
          const row = {
            word: word,
            definition: definition,
            example: "图片：" + file.name,
            imageData: String(reader.result || ""),
            imageName: file.name
          };
          const custom = buildCustomWord(row, exam);
          const exists = allWords().some(function (item) {
            return item.word.toLowerCase() === custom.word.toLowerCase() && item.examTypes.indexOf(exam) !== -1;
          });
          if (!exists) {
            state.customWords.push(custom);
          }
          persist();
          closeModal();
          state.currentExam = exam;
          session = createSession();
          render();
          showToast("已导入图片卡：" + custom.word);
        };
        reader.readAsDataURL(file);
      }

      function handleJsonImport(file) {
        const reader = new FileReader();
        reader.onload = function () {
          try {
            const data = JSON.parse(String(reader.result || ""));
            if (!data || typeof data !== "object") {
              throw new Error("JSON 结构无效");
            }
            if (Array.isArray(data.customWords)) {
              state.customWords = data.customWords;
            }
            if (data.progress && typeof data.progress === "object") {
              state.progress = data.progress;
            }
            if (data.settings && typeof data.settings === "object") {
              state.settings = Object.assign({}, defaultState.settings, data.settings);
            }
            persist();
            closeModal();
            session = createSession();
            render();
            showToast("已导入 JSON 备份");
          } catch (error) {
            showToast("JSON 导入失败：" + error.message);
          }
        };
        reader.readAsText(file, "utf-8");
      }

      function exportCurrentExamCsv() {
        const words = wordsForExam(state.currentExam);
        const header = ["word", "phonetic", "definition", "example", "root", "meaning", "affix", "audio_url", "image_url"];
        const rows = words.map(function (word) {
          const root = word.rootAffix && word.rootAffix.root ? word.rootAffix.root : "";
          const meaning = word.rootAffix && word.rootAffix.meaning ? word.rootAffix.meaning : "";
          const affix = word.rootAffix && word.rootAffix.affix ? word.rootAffix.affix : "";
          const example = word.exampleSentence.replace(/,/g, "，");
          const definition = word.definitionCn.replace(/,/g, "，");
          return [word.word, word.phonetic, definition, example, root, meaning, affix, word.audioUrl || "", word.imageData || ""]
            .map(function (value) { return '"' + String(value).replace(/"/g, '""') + '"'; })
            .join(",");
        });
        const csv = [header.join(",")].concat(rows).join("\r\n");
        downloadTextFile(csv, "词根宇宙-" + state.currentExam + "-词库.csv", "text/csv;charset=utf-8");
      }

      function speakWord(word) {
        if (!word) {
          return;
        }
        const sources = [word.audioUrl, getRemoteAudioUrl(word.word, 2), getRemoteAudioUrl(word.word, 1)]
          .filter(Boolean)
          .filter(function (url, index, list) { return list.indexOf(url) === index; });
        if (!sources.length) {
          fallbackSpeak(word.word);
          return;
        }
        playAudioSource(sources, 0, word.word);
      }

      function getRemoteAudioUrl(word, type) {
        if (!word) {
          return "";
        }
        return "https://dict.youdao.com/dictvoice?type=" + (type || 2) + "&audio=" + encodeURIComponent(word);
      }

      function playAudioSource(sources, index, text) {
        if (index >= sources.length) {
          fallbackSpeak(text);
          return;
        }
        const audio = new Audio(sources[index]);
        audio.onerror = function () {
          playAudioSource(sources, index + 1, text);
        };
        audio.play().catch(function () {
          playAudioSource(sources, index + 1, text);
        });
      }

      function fallbackSpeak(text) {
        if (!("speechSynthesis" in window)) {
          showToast("当前浏览器不支持语音合成");
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.88;
        const voices = window.speechSynthesis.getVoices();
        const englishVoice = voices.find(function (voice) { return voice.lang.indexOf("en") === 0; });
        if (englishVoice) {
          utterance.voice = englishVoice;
        }
        window.speechSynthesis.speak(utterance);
      }

      function showToast(message) {

      function navigationKey() {
        return state.currentExam + "|" + state.mode;
      }

      function pushNavigation() {
        const key = navigationKey();
        if (key === lastNavKey) {
          return;
        }
        navStack = navStack.slice(0, navIndex + 1);
        navStack.push({ exam: state.currentExam, mode: state.mode });
        navIndex = navStack.length - 1;
        lastNavKey = key;
      }

      function applyNavigationSnapshot(snapshot) {
        state.currentExam = snapshot.exam;
        state.mode = snapshot.mode;
        lastNavKey = navigationKey();
        session = createSession();
        persist();
        render();
      }

      function goBackNavigation() {
        if (navIndex > 0) {
          navIndex -= 1;
          applyNavigationSnapshot(navStack[navIndex]);
        } else {
          showToast("已经是上一步了");
        }
      }

      function goForwardNavigation() {
        if (navIndex < navStack.length - 1) {
          navIndex += 1;
          applyNavigationSnapshot(navStack[navIndex]);
        } else {
          showToast("已经是下一步了");
        }
      }

      function handleWordSearch(query) {
        const q = String(query || "").trim();
        if (!q) {
          return;
        }
        if (/^\d+$/.test(q) && session.queue.length) {
          const targetIndex = Math.max(0, Math.min(Number(q) - 1, session.queue.length - 1));
          session.index = targetIndex;
          session.flipped = false;
          session.attempted = false;
          saveStudyPosition(state.currentExam);
          persist();
          render();
          showToast("已定位到第 " + (targetIndex + 1) + " 个词：" + session.queue[targetIndex].word);
          return;
        }
        const exact = allWords().find(function (word) {
          return word.word.toLowerCase() === q.toLowerCase();
        });
        const fallback = exact || allWords().find(function (word) {
          return word.definitionCn && word.definitionCn.indexOf(q) !== -1;
        });
        if (!fallback) {
          showToast("没有找到相关单词");
          return;
        }
        const targetExam = fallback.examTypes[0] || "自定义";
        state.currentExam = targetExam;
        state.mode = exact ? "gallery" : "preview";
        previewOffset = 0;
        session = createSession();
        if (exact) {
          session.queue = [fallback].concat(getStudyQueue(targetExam).filter(function (item) {
            return item.id !== fallback.id;
          }));
          session.index = 0;
          session.flipped = false;
        }
        persist();
        render();
        if (!exact) {
          const input = document.getElementById("previewSearch");
          if (input) {
            input.value = q;
            input.dispatchEvent(new Event("input", { bubbles: true }));
          }
        }
        pushNavigation();
        showToast(exact ? ("已定位到 " + fallback.word) : ("已搜索：" + q));
      }

          });
          search.addEventListener("search", function () {

          });

        document.getElementById("forwardBtn").addEventListener("click", goForwardNavigation);
        navStack = [{ exam: state.currentExam, mode: state.mode }];
        navIndex = 0;
        lastNavKey = navigationKey();
      }

          if (event.target === event.currentTarget) {
            closeDrawer();
          }
        });
        document.getElementById("modalBackdrop").addEventListener("click", function (event) {
          if (event.target === event.currentTarget) {
            closeModal();
          }
        });

        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeExamMenu(examDropdown, examTrigger);
            closeDrawer();
            closeModal();
          }
        });
      }

      function closeExamMenu(dropdown, trigger) {
        if (!dropdown) {
          return;
        }
        dropdown.classList.remove("open");
        if (trigger) {
          trigger.setAttribute("aria-expanded", "false");
        }
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.onvoiceschanged = function () {
          window.speechSynthesis.getVoices();
        };
      }

      bindTopbarNavigation();
      bindGlobalEvents();
      render();
      maybeStartAssessment();
    })();
  </script>
</body>
</html>
