<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>词根宇宙 · 多语料库</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #eef2f8;
      --ink: #172033;
      --muted: #66738c;
      --line: #dce3ee;
      --blue: #1a2b4c;
      --blue-2: #223c68;
      --amber: #f5a623;
      --amber-soft: #fff1d2;
      --teal: #158b8b;
      --teal-soft: #d8f3f1;
      --red: #c94f4f;
      --red-soft: #fde5e5;
      --green: #2d8b57;
      --green-soft: #dff4e8;
      --shadow: 0 18px 50px rgba(20, 36, 66, 0.12);
      --radius: 8px;
      --radius-lg: 10px;
    }

    [data-theme="dark"] {
      --bg: #101725;
      --surface: #182236;
      --surface-2: #202c43;
      --ink: #edf2fb;
      --muted: #a9b5ca;
      --line: #2b3852;
      --blue: #1f3153;
      --blue-2: #29436f;
      --amber-soft: #3a2d14;
      --teal-soft: #123635;
      --red-soft: #402324;
      --green-soft: #183326;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      line-height: 1.55;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(245, 166, 35, 0.45);
      outline-offset: 2px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #fff;
      background: var(--blue);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--amber), #f9c45a);
    }

    .brand-sub {
      display: block;
      margin-top: -2px;
      color: rgba(255, 255, 255, 0.66);
      font-size: 12px;
      font-weight: 500;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .exam-dropdown {
      position: relative;
      flex: 0 0 auto;
    }

    .exam-trigger {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .exam-trigger:hover {
      border-color: rgba(255, 255, 255, 0.42);
      background: rgba(255, 255, 255, 0.18);
    }

    .exam-trigger .exam-label {
      color: rgba(255, 255, 255, 0.62);
      font-size: 12px;
      white-space: nowrap;
    }

    .exam-trigger strong {
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .exam-trigger svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .exam-dropdown.open .exam-trigger svg {
      transform: rotate(180deg);
    }

    .exam-menu {
      position: absolute;
      top: calc(100% + 9px);
      left: 0;
      z-index: 130;
      min-width: 220px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 18px 45px rgba(12, 20, 35, 0.24);
      opacity: 0;
      transform: translateY(-7px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .exam-dropdown.open .exam-menu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .exam-option {
      width: 100%;
      min-height: 39px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 10px;
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      text-align: left;
      font-weight: 650;
    }

    .exam-option:hover {
      background: var(--surface-2);
    }

    .exam-option.active {
      color: #7b5410;
      background: var(--amber-soft);
    }

    [data-theme="dark"] .exam-option.active {
      color: #ffd886;
    }

    .exam-option .exam-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .top-search {
      width: min(230px, 24vw);
      min-height: 38px;
      flex: 0 1 auto;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .top-search::placeholder {
      color: rgba(255, 255, 255, 0.62);
    }

    .top-search:focus {
      border-color: rgba(255, 255, 255, 0.48);
      background: rgba(255, 255, 255, 0.16);
    }

    body.force-mobile .topbar-inner {
      align-items: flex-start;
      padding: 12px 0;
      flex-direction: column;
    }

    body.force-mobile .top-actions {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(6, 36px);
      gap: 6px;
      justify-content: end;
    }

    body.force-mobile .exam-dropdown,
    body.force-mobile .top-search {
      grid-column: 1 / -1;
      width: 100%;
    }

    body.force-mobile .exam-trigger {
      width: 100%;
      justify-content: space-between;
    }

    body.force-mobile .top-search {
      width: 100%;
      min-width: 0;
    }

    body.force-mobile .shell {
      width: min(100% - 20px, 520px);
      padding-top: 16px;
    }

    body.force-mobile .summary {
      grid-template-columns: 1fr;
    }

    body.force-mobile .stat-grid,
    body.force-mobile .root-matrix {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    body.force-mobile .listen-options {
      grid-template-columns: 1fr;
    }

    body.force-mobile .review-stats,
    body.force-mobile .teacher-grid {
      grid-template-columns: 1fr;
    }

    body.force-mobile .mode-toolbar {
      align-items: flex-start;
      flex-direction: column;
    }

    body.force-mobile .training-task {
      align-items: flex-start;
      flex-direction: column;
    }

    body.force-mobile .training-start {
      width: 100%;
    }

    body.force-mobile .card-face {
      padding: 28px 20px 30px;
    }

    body.force-mobile .icon-btn {
      width: 36px;
      height: 36px;
    }

    body.force-mobile .brand-sub {
      display: none;
    }

    body.force-desktop {
      min-width: 1180px;
    }

    body.force-desktop .topbar-inner {
      flex-direction: row;
      align-items: center;
    }

    body.force-desktop .top-actions {
      width: auto;
      justify-content: flex-end;
    }

    body.force-desktop .shell {
      width: min(1120px, calc(100% - 32px));
    }

    body.force-desktop .summary {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    body.force-desktop .stat-grid,
    body.force-desktop .review-stats {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    body.force-desktop .teacher-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .icon-btn svg,
    .brand-mark svg,
    .modebar svg,
    .text-btn svg,
    .primary-btn svg,
    .ghost-btn svg,
    .soft-btn svg,
    .card-action svg,
    .part svg,
    .close-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }

    .summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 16px;
    }

    .summary-main {
      min-width: 0;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(20, 36, 66, 0.05);
    }

    .summary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .summary-title {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .summary-title strong {
      display: inline-block;
      margin-left: 6px;
      color: var(--blue);
      font-size: 18px;
    }

    [data-theme="dark"] .summary-title strong {
      color: var(--amber);
    }

    .summary-count {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      color: #7b5410;
      background: var(--amber-soft);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    [data-theme="dark"] .summary-count {
      color: #ffd886;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-2);
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--amber), #f8be50);
      transition: width 0.45s ease;
    }

    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .summary-meta b {
      color: var(--ink);
      font-weight: 700;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(118px, 1fr));
      gap: 10px;
    }

    .stat {
      min-height: 82px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .stat-value {
      margin-top: 4px;
      color: var(--ink);
      font-size: 23px;
      font-weight: 750;
      line-height: 1.1;
    }

    .stat-value small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .modebar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .modebar::-webkit-scrollbar {
      display: none;
    }

    .mode-btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--surface);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .mode-btn:hover {
      color: var(--ink);
      border-color: #b8c4d8;
    }

    .mode-btn.active {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    .mode-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .eyebrow strong {
      color: var(--ink);
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .switch input {
      width: 34px;
      height: 19px;
      margin: 0;
      position: relative;
      appearance: none;
      border-radius: 999px;
      background: #c4ccda;
      transition: background 0.2s ease;
    }

    .switch input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s ease;
    }

    .switch input:checked {
      background: var(--amber);
    }

    .switch input:checked::after {
      transform: translateX(15px);
    }

    .preview-search {
      width: min(520px, 100%);
      min-height: 42px;
      margin-bottom: 14px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
    }

    .preview-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .preview-row {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .preview-row:hover {
      border-color: #b8c4d8;
      transform: translateY(-1px);
    }

    .preview-speak {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--blue);
      transition: background 0.2s ease;
    }

    .preview-speak:hover {
      background: var(--blue-2);
    }

    .preview-speak svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .preview-main {
      min-width: 0;
      flex: 1;
    }

    .preview-word {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 9px;
      color: var(--ink);
      font-weight: 750;
      line-height: 1.25;
      word-break: break-word;
    }

    .preview-phonetic {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .preview-definition {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .preview-empty,
    .preview-result {
      padding: 16px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .preview-load-more {
      width: min(280px, 100%);
      min-height: 42px;
      margin: 16px auto 0;
      display: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--blue);
      background: var(--surface);
    }

    .preview-load-more:hover {
      border-color: var(--blue);
    }

    .daily-root {
      margin-bottom: 16px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--surface), var(--surface-2));
    }

    .daily-root-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .daily-root-title {
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
    }

    .root-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      color: #7b5410;
      background: var(--amber-soft);
      font-size: 13px;
      font-weight: 700;
    }

    [data-theme="dark"] .root-badge {
      color: #ffd886;
    }

    .root-matrix {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .matrix-word {
      min-width: 0;
      padding: 10px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: left;
      color: var(--ink);
      background: var(--surface);
    }

    .matrix-word strong {
      display: block;
      overflow: hidden;
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .matrix-word span {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .word-card {
      position: relative;
      width: 100%;
      perspective: 1300px;
    }

    .card-inner {
      position: relative;
      min-height: 350px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.72, 0.24, 1);
    }

    .word-card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 36px 36px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backface-visibility: hidden;
      text-align: center;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .card-kicker {
      color: var(--amber);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .card-word {
      margin: 10px 0 4px;
      color: var(--blue);
      font-size: clamp(34px, 6vw, 56px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: 0;
      word-break: break-word;
    }

    [data-theme="dark"] .card-word {
      color: #fff;
    }

    .card-phonetic {
      color: var(--muted);
      font-size: 15px;
    }

    .root-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
    }

    .part {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 0 11px;
      border-radius: 7px;
      color: var(--ink);
      background: var(--surface-2);
      font-size: 13px;
      font-weight: 650;
    }

    .part.root {
      color: #0d6d6b;
      background: var(--teal-soft);
      cursor: pointer;
    }

    .part.prefix {
      color: #8b6118;
      background: var(--amber-soft);
    }

    .part.suffix {
      color: #34578f;
      background: #e0e9f8;
    }

    [data-theme="dark"] .part.prefix {
      color: #ffd886;
    }

    [data-theme="dark"] .part.suffix {
      color: #b9cdf1;
      background: #24344f;
    }

    .part em {
      font-style: normal;
      font-weight: 500;
      opacity: 0.78;
    }

    .definition-cn {
      max-width: 680px;
      margin: 16px auto 12px;
      color: var(--ink);
      font-size: clamp(22px, 3.8vw, 30px);
      font-weight: 750;
      line-height: 1.45;
    }

    .example {
      max-width: 680px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin-top: 16px;
    }

    .tag {
      padding: 3px 8px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 11px;
      font-weight: 600;
    }

    .difficulty {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-top: 18px;
      color: var(--amber);
      font-size: 13px;
    }

    .card-top-actions {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      display: flex;
      gap: 6px;
    }

    .card-action {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--surface);
      box-shadow: 0 4px 14px rgba(20, 36, 66, 0.06);
    }

    .card-action:hover {
      color: var(--ink);
      border-color: #b7c3d5;
    }

    .card-action.active {
      color: #fff;
      border-color: var(--amber);
      background: var(--amber);
    }

    .card-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .ghost-btn,
    .soft-btn,
    .text-btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 15px;
      border-radius: 8px;
      font-weight: 650;
      transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease;
    }

    .primary-btn {
      color: #fff;
      background: var(--blue);
    }

    .primary-btn:hover {
      background: var(--blue-2);
      transform: translateY(-1px);
    }

    .ghost-btn {
      color: var(--ink);
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .ghost-btn:hover {
      border-color: #b7c3d5;
      transform: translateY(-1px);
    }

    .soft-btn {
      color: #7b5410;
      background: var(--amber-soft);
    }

    [data-theme="dark"] .soft-btn {
      color: #ffd886;
    }

    .text-btn {
      padding: 0 9px;
      color: var(--muted);
      background: transparent;
    }

    .text-btn:hover {
      color: var(--ink);
    }

    .queue-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      margin-top: 16px;
    }

    .queue-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--line);
    }

    .queue-dot.active {
      background: var(--amber);
    }

    .queue-dot.done {
      background: var(--teal);
    }

    .study-panel {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .study-mode-title {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .prompt-chinese {
      margin: 18px 0 10px;
      color: var(--blue);
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 800;
      line-height: 1.35;
    }

    [data-theme="dark"] .prompt-chinese {
      color: #fff;
    }

    .speaker-button {
      width: 58px;
      height: 58px;
      display: inline-grid;
      place-items: center;
      margin: 10px auto 18px;
      border-radius: 50%;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 10px 26px rgba(26, 43, 76, 0.25);
      transition: transform 0.2s ease;
    }

    .speaker-button:hover {
      transform: scale(1.05);
    }

    .speaker-button svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .word-mask {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin: 18px 0;
    }

    .mask-box {
      width: 38px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: var(--surface-2);
      font-size: 18px;
      font-weight: 750;
      text-transform: uppercase;
      transition: all 0.18s ease;
    }

    .mask-box.good {
      color: #fff;
      border-color: var(--green);
      background: var(--green);
    }

    .mask-box.bad {
      color: #fff;
      border-color: var(--red);
      background: var(--red);
    }

    .spell-input {
      width: min(320px, 100%);
      height: 50px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      text-align: center;
      font-size: 20px;
      letter-spacing: 0;
      text-transform: lowercase;
    }

    .spell-input:focus {
      border-color: var(--amber);
    }

    .hint {
      min-height: 24px;
      margin: 12px auto 0;
      color: var(--muted);
      font-size: 13px;
    }

    .hint.wrong {
      color: var(--red);
    }

    .hint.success {
      color: var(--green);
    }

    .answer-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .listen-stage {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .timer {
      width: 58px;
      height: 58px;
      display: inline-grid;
      place-items: center;
      margin: 0 auto 12px;
      border: 4px solid var(--amber);
      border-radius: 50%;
      color: var(--amber);
      font-size: 22px;
      font-weight: 800;
    }

    .listen-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .option-btn {
      min-height: 58px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      text-align: center;
      font-size: 15px;
      transition: all 0.18s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--blue);
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.78;
    }

    .option-btn.correct {
      color: #fff;
      border-color: var(--green);
      background: var(--green);
    }

    .option-btn.wrong {
      color: #fff;
      border-color: var(--red);
      background: var(--red);
    }

    .feedback {
      margin-top: 16px;
      min-height: 24px;
      font-weight: 700;
    }

    .feedback.correct {
      color: var(--green);
    }

    .feedback.wrong {
      color: var(--red);
    }

    .drawer-backdrop,
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: flex;
      justify-content: flex-end;
      background: rgba(12, 20, 35, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .drawer-backdrop.open,
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      width: min(480px, 100%);
      height: 100%;
      overflow-y: auto;
      padding: 24px;
      background: var(--surface);
      box-shadow: -18px 0 50px rgba(12, 20, 35, 0.22);
      transform: translateX(100%);
      transition: transform 0.28s ease;
    }

    .drawer-backdrop.open .drawer {
      transform: translateX(0);
    }

    .drawer-head,
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .drawer-title,
    .modal-title {
      margin: 0;
      color: var(--ink);
      font-size: 21px;
      line-height: 1.3;
    }

    .drawer-sub,
    .modal-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--surface);
    }

    .root-group {
      margin-bottom: 18px;
    }

    .root-group-title {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .root-word-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .root-word {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: var(--surface-2);
      font-size: 13px;
      font-weight: 650;
    }

    .root-word span {
      color: var(--muted);
      font-weight: 500;
    }

    .ai-content {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.75;
    }

    .ai-content pre {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 14px;
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface-2);
    }

    .ai-section {
      margin: 14px 0;
      padding: 14px;
      border-left: 3px solid var(--amber);
      border-radius: 0 8px 8px 0;
      background: var(--surface-2);
    }

    .ai-section h4 {
      margin: 0 0 7px;
      font-size: 14px;
    }

    .modal-backdrop {
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal {
      width: min(620px, 100%);
      max-height: min(760px, calc(100vh - 40px));
      overflow-y: auto;
      padding: 24px;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(12, 20, 35, 0.3);
      transform: translateY(18px);
      transition: transform 0.24s ease;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0);
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
    }

    .field textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.55;
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .drop-zone {
      display: grid;
      place-items: center;
      min-height: 120px;
      padding: 18px;
      border: 1px dashed #9aa9c1;
      border-radius: 10px;
      color: var(--muted);
      background: var(--surface-2);
      text-align: center;
    }

    .drop-zone strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
    }

    .file-format {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 120;
      max-width: min(420px, calc(100% - 32px));
      padding: 12px 16px;
      border-radius: 8px;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 14px 38px rgba(12, 20, 35, 0.25);
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .empty-state {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 50px 24px;
      border: 1px dashed #9aa9c1;
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 18px;
    }

    .empty-state button {
      margin-top: 16px;
    }

    .exam-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      color: #fff;
      background: var(--teal);
      font-size: 11px;
      font-weight: 750;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .assessment-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(8, 16, 30, 0.58);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .assessment-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .assessment-card {
      width: min(860px, 100%);
      max-height: min(760px, calc(100vh - 48px));
      overflow: auto;
      padding: 28px;
      border-radius: var(--radius-lg);
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.28);
    }

    .assessment-step {
      display: none;
    }

    .assessment-step.active {
      display: block;
    }

    .assessment-kicker {
      color: var(--amber);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .assessment-title {
      margin: 6px 0 8px;
      color: var(--ink);
      font-size: 30px;
      line-height: 1.25;
    }

    .assessment-sub {
      max-width: 620px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .assessment-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .assessment-option {
      min-height: 58px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }

    .assessment-option:hover {
      border-color: var(--blue);
      transform: translateY(-1px);
    }

    .assessment-option.selected {
      border-color: var(--amber);
      background: var(--amber-soft);
    }

    .assessment-option.correct {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .assessment-option.wrong {
      border-color: var(--red);
      background: var(--red-soft);
    }

    .assessment-progress {
      height: 7px;
      overflow: hidden;
      margin-bottom: 22px;
      border-radius: 999px;
      background: var(--surface-2);
    }

    .assessment-progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--amber), #f8be50);
      transition: width 0.24s ease;
    }

    .assessment-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    .review-dashboard,
    .speak-stage,
    .teacher-panel {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(20, 36, 66, 0.05);
    }

    .review-head,
    .speak-head,
    .teacher-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .review-title,
    .speak-title,
    .teacher-title {
      margin: 0;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.3;
    }

    .review-sub,
    .speak-sub,
    .teacher-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .review-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .review-stat {
      padding: 14px;
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .review-stat strong {
      display: block;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.1;
    }

    .review-stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .speak-target {
      padding: 20px;
      border-radius: var(--radius);
      background: var(--surface-2);
      text-align: center;
    }

    .speak-target .card-word {
      margin-bottom: 4px;
    }

    .speak-score {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 16px;
      color: var(--blue);
      font-weight: 800;
    }

    .speak-score strong {
      font-size: 40px;
      line-height: 1;
    }

    .speak-transcript {
      min-height: 48px;
      margin: 16px 0;
      padding: 12px 14px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      background: var(--bg);
    }

    .teacher-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .teacher-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .teacher-card h4 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 15px;
    }

    .teacher-card p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .training-section {
      margin: 16px 0;
    }

    .training-section-title {
      margin: 0 0 10px;
      color: var(--ink);
      font-size: 17px;
    }

    .training-task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .training-task {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .training-task-index {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--blue);
      background: var(--amber-soft);
      font-weight: 800;
    }

    .training-task-main {
      min-width: 0;
      flex: 1;
    }

    .training-task-title {
      color: var(--ink);
      font-weight: 700;
      line-height: 1.35;
    }

    .training-task-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .training-start {
      min-height: 36px;
      flex: 0 0 auto;
      padding: 0 13px;
      border-radius: 8px;
      color: #fff;
      background: var(--blue);
      transition: background 0.2s ease;
    }

    .training-start:hover {
      background: var(--blue-2);
    }

    .training-empty {
      padding: 34px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      text-align: center;
    }

    .training-empty strong {
      display: block;
      color: var(--ink);
      font-size: 22px;
    }

    .training-empty p {
      margin: 8px 0 18px;
      color: var(--muted);
    }

    .word-image {
      width: min(100%, 360px);
      max-height: 240px;
      object-fit: cover;
      margin: 12px auto;
      border-radius: var(--radius);
      display: block;
    }

    @media (max-width: 840px) {
      .topbar-inner {
        align-items: flex-start;
        padding: 12px 0;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(6, 36px);
        gap: 6px;
        justify-content: end;
      }

      .exam-dropdown,
      .top-search {
        grid-column: 1 / -1;
        width: 100%;
      }

      .exam-trigger {
        width: 100%;
        justify-content: space-between;
      }

      .top-search {
        width: auto;
        min-width: 0;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .root-matrix {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .listen-options {
        grid-template-columns: 1fr;
      }

      .review-stats,
      .teacher-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card-face {
        padding: 28px 20px 30px;
      }

      .study-panel,
      .listen-stage {
        padding: 22px 18px;
      }
    }

    @media (max-width: 520px) {
      .shell {
        width: min(100% - 20px, 1120px);
        padding-top: 16px;
      }

      .brand-sub {
        display: none;
      }

      .top-actions {
        gap: 6px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
      }

      .exam-trigger {
        min-height: 36px;
        font-size: 12px;
      }

      .exam-menu {
        min-width: 200px;
      }

      .summary-main {
        padding: 15px;
      }

      .stat {
        min-height: 72px;
        padding: 10px;
      }

      .stat-value {
        font-size: 20px;
      }

      .review-stats,
      .teacher-grid {
        grid-template-columns: 1fr;
      }

      .training-task {
        align-items: flex-start;
        flex-direction: column;
      }

      .training-start {

        const saved = readStorage(STORAGE_KEY);

          return JSON.parse(JSON.stringify(defaultState));
        }
        const merged = JSON.parse(JSON.stringify(defaultState));
        Object.keys(merged).forEach(function (key) {
          if (Object.prototype.hasOwnProperty.call(saved, key)) {
            merged[key] = saved[key];
          }
        });
        merged.settings = Object.assign({}, defaultState.settings, saved.settings || {});
        merged.progress = merged.progress || {};
        merged.customWords = Array.isArray(merged.customWords) ? merged.customWords : [];
        merged.assessment = saved.assessment || null;
        return merged;

        try {

      function shuffle(list) {
        const arr = list.slice();
        for (let i = arr.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = arr[i];
          arr[i] = arr[j];
          arr[j] = temp;
        }
        return arr;
      }

            correct: 0,

          state.progress[exam].queueOrder = [];

          state.progress[exam].queueIndex = 0;
        }
        return state.progress[exam];

          valid[word.id] = true;
        });
        return progress.seen.filter(function (id) { return valid[id]; }).length;
      }

      const REVIEW_INTERVALS = [
        5 * 60 * 1000,
        30 * 60 * 1000,
        12 * 60 * 60 * 1000,
        1 * 24 * 60 * 60 * 1000,
        3 * 24 * 60 * 60 * 1000,
        7 * 24 * 60 * 60 * 1000,
        14 * 24 * 60 * 60 * 1000,
        30 * 24 * 60 * 60 * 1000
      ];

      function getScheduleEntry(progress, wordId) {
        if (!progress.schedule) {
          progress.schedule = {};
        }
        if (!progress.schedule[wordId]) {
          progress.schedule[wordId] = {
            box: 0,
            next: Date.now(),
            lapses: 0,
            reviews: 0,
            last: 0,
            history: []
          };
        }
        return progress.schedule[wordId];
      }

      function scheduleReview(exam, wordId, quality) {
        const progress = ensureProgress(exam);
        const entry = getScheduleEntry(progress, wordId);
        entry.reviews += 1;
        entry.last = Date.now();
        const isGood = quality === true || quality === "good";
        const isFuzzy = quality === "fuzzy";
        const isAgain = quality === false || quality === "again";
        entry.history.push({ time: Date.now(), quality: isGood ? "good" : (isFuzzy ? "fuzzy" : "again") });
        if (entry.history.length > 30) {
          entry.history.shift();
        }
        if (isGood) {
          entry.box = Math.min(entry.box + 1, REVIEW_INTERVALS.length - 1);
          entry.lapses = 0;
          const mistakeIndex = progress.mistakes.indexOf(wordId);
          if (mistakeIndex !== -1) {
            progress.mistakes.splice(mistakeIndex, 1);
          }
        } else if (isFuzzy) {
          entry.box = Math.max(0, entry.box - 1);
          entry.lapses = 0;
          if (progress.mistakes.indexOf(wordId) === -1) {
            progress.mistakes.push(wordId);
          }
        } else {
          entry.lapses += 1;
          entry.box = Math.max(0, entry.box - 2);
          if (progress.mistakes.indexOf(wordId) === -1) {
            progress.mistakes.push(wordId);
          }
        }
        entry.next = Date.now() + REVIEW_INTERVALS[entry.box];
      }

      function getDueWords(exam) {
        const progress = ensureProgress(exam);
        const now = Date.now();
        return wordsForExam(exam).filter(function (word) {
          const entry = progress.schedule && progress.schedule[word.id];
          return entry && entry.next <= now;
        });
      }

      function getDueCount(exam) {
        return getDueWords(exam).length;
      }

      function getStudyQueue(exam) {
        const progress = ensureProgress(exam);
        const words = wordsForExam(exam);
        if (!words.length) {
          return [];
        }
        const validIds = {};
        words.forEach(function (word) {
          validIds[word.id] = true;
        });
        let order = progress.queueOrder.filter(function (id) { return validIds[id]; });
        if (order.length !== words.length) {
          order = words.map(function (word) { return word.id; });
          progress.queueOrder = order.slice();
        }
        return order.map(function (id) {
          return allWords().find(function (word) { return word.id === id; });
        }).filter(Boolean);
      }

      function currentWord() {
        if (!session.queue.length) {
          return null;
        }
        return session.queue[session.index] || null;
      }

      function restoreQueuePosition(exam) {
        if (session.trainingQueue || !session.queue.length) {
          return;
        }
        const progress = ensureProgress(exam);
        session.index = Math.max(0, Math.min(progress.queueIndex || 0, session.queue.length - 1));
      }

      function getSavedQueueIndex(exam) {
        if (!session.queue.length) {
          return 0;
        }
        const progress = ensureProgress(exam);
        return Math.max(0, Math.min(progress.queueIndex || 0, session.queue.length - 1));
      }

      function goToWord(offset) {
        if (!session.queue.length) {
          return;
        }
        session.index = (session.index + offset + session.queue.length) % session.queue.length;
        session.flipped = false;
        session.attempted = false;
        render();
      }

      function reshuffleStudyQueue(exam) {
        const progress = ensureProgress(exam);
        const words = wordsForExam(exam);
        progress.queueOrder = shuffle(words.map(function (word) { return word.id; }));
        progress.queueIndex = 0;
        session.queue = getStudyQueue(exam);
        session.index = 0;
        session.flipped = false;
        persist();
        render();
        showToast("已刷新学习顺序");
      }

      function buildRootStats(exam, includeCross) {
        const currentWords = wordsForExam(exam);
        const currentRoots = {};
        currentWords.forEach(function (word) {
          word.roots.forEach(function (root) {
            if (!currentRoots[root]) {
              currentRoots[root] = { root: root, meaning: "", currentCount: 0, crossCount: 0, words: [] };
            }
            currentRoots[root].currentCount += 1;
            currentRoots[root].words.push(word);
          });
        });

        Object.keys(currentRoots).forEach(function (root) {
          const primaryWord = currentRoots[root].words.find(function (word) {
            const part = word.parts.find(function (item) { return item.type === "root" && item.text === root; });
            return part;
          });
          if (primaryWord) {
            const part = primaryWord.parts.find(function (item) { return item.type === "root" && item.text === root; });
            currentRoots[root].meaning = part.meaning || "";
          }
        });

        const rootList = Object.keys(currentRoots).map(function (key) { return currentRoots[key]; });
        if (includeCross) {
          rootList.forEach(function (item) {
            item.crossCount = allWords().filter(function (word) { return word.roots.indexOf(item.root) !== -1; }).length;
          });
        }
        return rootList.sort(function (a, b) {
          if (includeCross) {
            return b.crossCount - a.crossCount;
          }
          return b.currentCount - a.currentCount;
        });
      }

      function renderRootLine(word, compact) {
        if (!word || !word.parts || !word.parts.length) {
          return "";
        }
        return word.parts.map(function (part) {
          const rootClass = part.type === "root" ? "part root" : "part " + part.type;
          const dataRoot = part.type === "root" ? ' data-root="' + escapeAttr(part.text) + '"' : "";
          const meaning = compact ? "" : ' <em>' + escapeHtml(part.meaning) + "</em>";
          return '<button type="button" class="' + rootClass + '"' + dataRoot + ">" +
            "<span>" + escapeHtml(part.text) + "</span>" + meaning + "</button>";
        }).join("");
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function render() {
        document.documentElement.dataset.theme = state.theme;
        renderExamOptions();
        renderSummary();
        renderModebar();
        renderMode();
        saveStudyPosition(state.currentExam);
        updateThemeIcon();
        applyViewMode();
        updateViewModeIcon();
        bindDynamicEvents();
      }

      function saveStudyPosition(exam) {
        const order = session.queue ? session.queue.map(function (word) { return word.id; }) : [];
        state.lastSession = {
          exam: exam,
          mode: state.mode,
          queueOrder: order,
          queueIndex: session.index || 0,
          trainingQueue: !!session.trainingQueue
        };
        if (!session.trainingQueue && order.length) {
          const progress = ensureProgress(exam);
          progress.queueIndex = session.index;
          progress.queueOrder = order;
        }
        persist();
      }

      function restoreLastSession() {
        const snapshot = state.lastSession;
        if (!snapshot) {
          return;
        }
        if (snapshot.exam) {
          state.currentExam = snapshot.exam;
        }
        if (snapshot.mode) {
          state.mode = snapshot.mode;
        }
        if (Array.isArray(snapshot.queueOrder)) {
          session.queue = snapshot.queueOrder.map(function (id) {
            return allWords().find(function (word) { return word.id === id; });
          }).filter(Boolean);
          session.index = Math.max(0, Math.min(Number(snapshot.queueIndex) || 0, session.queue.length - 1));
          session.trainingQueue = !!snapshot.trainingQueue;
        }
      }

      function renderExamOptions() {
        const triggerText = document.getElementById("examTriggerText");
        const menu = document.getElementById("examMenu");
        if (triggerText) {
          triggerText.textContent = state.currentExam + " · " + getSeenCount(state.currentExam) + "/" + wordsForExam(state.currentExam).length;
        }
        if (!menu) {
          return;
        }
        menu.innerHTML = EXAM_TYPES.map(function (exam) {
          const total = wordsForExam(exam).length;
          const learned = getSeenCount(exam);
          return '<button class="exam-option' + (exam === state.currentExam ? " active" : "") + '" data-exam="' + escapeAttr(exam) + '" role="option" aria-selected="' + (exam === state.currentExam ? "true" : "false") + '">' +
            "<span>" + escapeHtml(exam) + "</span>" +
            '<span class="exam-count">' + learned + "/" + total + "</span>" +
            "</button>";
        }).join("");
      }

      function renderSummary() {
        const exam = state.currentExam;
        const words = wordsForExam(exam);
        const progress = ensureProgress(exam);
        const validIds = {};
        words.forEach(function (word) {
          validIds[word.id] = true;
        });
        const masteredCount = progress.mastered.filter(function (id) { return validIds[id]; }).length;
        const seenCount = getSeenCount(exam);
        const goal = Number(state.settings.dailyGoal) || 30;
        const goalPct = words.length ? Math.min(100, Math.round((masteredCount / goal) * 100)) : 0;
        const accuracy = getAccuracy(exam);

        document.getElementById("summaryExam").textContent = exam;
        document.getElementById("summaryCount").textContent = seenCount + "/" + words.length;
        document.getElementById("summaryModeLabel").textContent = MODE_LABELS[state.mode] || "学习模式";
        document.getElementById("goalFill").style.width = goalPct + "%";
        document.getElementById("goalText").textContent = goal + " 词";
        document.getElementById("masteredText").textContent = masteredCount + " 词";
        document.getElementById("accuracyText").textContent = accuracy + "%";
        document.getElementById("bookmarkText").textContent = progress.bookmarks.length + " 词";
        document.getElementById("dueText").textContent = getDueCount(exam) + " 词";
        document.getElementById("examTotal").textContent = words.length;
        const rate = words.length ? Math.round((masteredCount / words.length) * 100) : 0;
        document.getElementById("masterRate").textContent = rate + "%";
        document.getElementById("dueCount").textContent = getDueCount(exam);
        document.getElementById("globalTotal").textContent = allWords().length;
      }

      function renderModebar() {
        document.querySelectorAll(".mode-btn[data-mode]").forEach(function (button) {

        if (!icon) {

      function renderMode() {
        const main = document.getElementById("main");
        if (!main) {
          return;
        }
        if (state.mode === "gallery") {
          renderGallery(main);
        } else if (state.mode === "preview") {
          renderPreview(main);
        } else if (state.mode === "spelling") {
          renderSpelling(main);
        } else if (state.mode === "listening") {
          renderListening(main);
        } else if (state.mode === "crossover") {
          renderCrossover(main);
        } else if (state.mode === "review") {
          renderReview(main);
        } else if (state.mode === "speaking") {
          renderSpeaking(main);
        } else if (state.mode === "teacher") {
          renderTeacher(main);
        } else if (state.mode === "training") {
          renderTraining(main);
        } else if (state.mode === "trainingCheck") {
          renderTrainingCheck(main);
        } else {
          main.innerHTML = "";
        }
      }

      function renderGallery(main) {
        const exam = state.currentExam;
        const words = wordsForExam(exam);
        if (!words.length) {
          main.innerHTML = emptyStateHtml("这个词库还没有单词", "上传 CSV 或切换到其他词库开始学习。", "上传词库", "openUpload");
          return;
        }
        if (!session.trainingQueue && (!session.queue.length || session.queue[0] && wordsForExam(exam).indexOf(session.queue[0]) === -1 && state.customWords.indexOf(session.queue[0]) === -1)) {
          session.queue = getStudyQueue(exam);
          session.index = getSavedQueueIndex(exam);
        }
        if (!session.trainingQueue && session.queue.length && session.queue[0] && session.queue[0].examTypes && session.queue[0].examTypes.indexOf(exam) === -1 && state.currentExam !== "自定义") {
          session.queue = getStudyQueue(exam);
          session.index = getSavedQueueIndex(exam);
        }
        let word = currentWord();
        if (!word) {
          session.queue = getStudyQueue(exam);
          session.index = getSavedQueueIndex(exam);
          word = currentWord();
        }
        if (word) {
          markSeen(exam, word.id);
        }

        const rootStats = buildRootStats(exam, true);
        const dailyRoot = getDailyRoot(exam);
        main.innerHTML = '<div class="mode-toolbar">' +
          '<div class="eyebrow">词根画廊 · <strong>' + escapeHtml(exam) + "</strong></div>" +
          '<div class="mode-toolbar-actions"><label class="switch"><input type="checkbox" id="crossRootToggle" checked /> 显示跨词库同根词</label>' +
          '<button class="ghost-btn" data-action="reshuffleQueue">刷新顺序</button></div>' +
          "</div>" +
          renderDailyRoot(dailyRoot) +
          renderCard(word, false) +
          '<div class="card-controls">' +
          '<button class="ghost-btn" data-action="prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>上一词</button>' +
          '<button class="primary-btn" data-action="flip">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>' +
          (session.flipped ? "回到词根" : "显示释义") +
          "</button>" +
          '<button class="ghost-btn" data-action="ai">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>' +
          "AI 解惑" +
          "</button>" +
          '<button class="ghost-btn" data-action="next">下一词<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>' +
          "</div>" +
          renderQueueDots() +
          '<div class="mode-toolbar" style="margin-top:26px"><div class="eyebrow">当前词库词根索引 · ' + rootStats.length + " 个</div></div>" +
          '<div class="root-matrix" id="rootGallery">' +
          rootStats.slice(0, 10).map(function (item) {
            return '<button class="matrix-word" data-root="' + escapeAttr(item.root) + '">' +
              "<strong>" + escapeHtml(item.root) + " · " + escapeHtml(item.meaning) + "</strong>" +
              "<span>当前库 " + item.currentCount + " 词" + (item.crossCount ? " · 跨库 " + item.crossCount + " 词" : "") + "</span>" +
              "</button>";
          }).join("") +
          "</div>";
      }

      function renderPreview(main) {
        const exam = state.currentExam;
        const words = wordsForExam(exam);
        previewOffset = 0;
        if (!words.length) {
          main.innerHTML = emptyStateHtml("这个词库还没有单词", "上传 CSV 或切换到其他词库开始预览。", "上传词库", "openUpload");
          return;
        }
        main.innerHTML = '<div class="mode-toolbar">' +
          '<div class="eyebrow">单词预览 · <strong>' + escapeHtml(exam) + "</strong></div>" +
          '<div class="preview-result" id="previewResult">共 ' + words.length + " 词</div>" +
          "</div>" +
          '<input class="preview-search" id="previewSearch" type="search" placeholder="搜索英文、音标或中文释义" autocomplete="off" />' +
          '<div class="preview-list" id="previewList"></div>' +
          '<button class="preview-load-more" id="previewLoadMore">加载更多</button>';
        renderPreviewList("");
      }

      function getPreviewWords(query) {
        const q = String(query || "").trim().toLowerCase();
        return wordsForExam(state.currentExam).filter(function (word) {
          if (!q) {
            return true;
          }
          return (word.word || "").toLowerCase().indexOf(q) !== -1 ||
            (word.phonetic || "").toLowerCase().indexOf(q) !== -1 ||
            (word.definitionCn || "").toLowerCase().indexOf(q) !== -1;
        });
      }

      function renderPreviewRow(word) {
        return '<div class="preview-row">' +
          '<button class="preview-speak" data-preview-speak="' + escapeAttr(word.id) + '" title="播放标准读音" aria-label="播放标准读音"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>' +
          '<div class="preview-main">' +
          '<div class="preview-word">' + escapeHtml(word.word) + '<span class="preview-phonetic">' + escapeHtml(word.phonetic || "/暂无音标/") + "</span></div>" +
          '<div class="preview-definition">' + escapeHtml(word.definitionCn || "暂无释义") + "</div>" +
          "</div>" +
          "</div>";
      }

      function renderPreviewList(query) {
        const words = getPreviewWords(query);
        const visible = words.slice(0, previewOffset + PREVIEW_PAGE_SIZE);
        const list = document.getElementById("previewList");
        if (list) {
          list.innerHTML = visible.length
            ? visible.map(renderPreviewRow).join("")
            : '<div class="preview-empty">没有匹配的单词</div>';
        }
        const result = document.getElementById("previewResult");
        if (result) {
          result.textContent = words.length ? ("共 " + words.length + " 词") : "未找到匹配单词";
        }

        if (loadMore) {

      function bindPreviewSpeakers() {
        document.querySelectorAll("[data-preview-speak]").forEach(function (button) {
          button.onclick = function (event) {
            event.stopPropagation();
            const word = allWords().find(function (item) { return item.id === button.dataset.previewSpeak; });
            if (word) {
              speakWord(word);
            }
          };
        });
      }

      function bindPreviewEvents() {
        const input = document.getElementById("previewSearch");
        const loadMore = document.getElementById("previewLoadMore");
        if (input) {
          input.oninput = function () {
            previewOffset = 0;
            renderPreviewList(input.value);

        if (loadMore) {
          loadMore.onclick = function () {
            previewOffset += PREVIEW_PAGE_SIZE;
            renderPreviewList(input ? input.value : "");

      function renderDailyRoot(dailyRoot) {
        if (!dailyRoot) {
          return "";
        }
        return '<div class="daily-root">' +
          '<div class="daily-root-head">' +
          '<div class="daily-root-title">每日词根早餐</div>' +
          '<div class="root-badge">' + escapeHtml(dailyRoot.root) + " · " + escapeHtml(dailyRoot.meaning) + "</div>" +
          "</div>" +
          '<div class="root-matrix">' +
          dailyRoot.words.map(function (word) {
            return '<button class="matrix-word" data-root-word="' + escapeAttr(word.id) + '">' +
              "<strong>" + escapeHtml(word.word) + "</strong>" +
              "<span>" + escapeHtml(word.definitionCn) + "</span>" +
              "</button>";
          }).join("") +
          "</div></div>";
      }

      function getDailyRoot(exam) {
        const words = wordsForExam(exam);
        if (!words.length) {
          return null;
        }
        const rootMap = {};
        words.forEach(function (word) {
          word.roots.forEach(function (root) {
            if (!rootMap[root]) {
              rootMap[root] = { root: root, meaning: "", words: [] };
            }
            rootMap[root].words.push(word);
          });
        });
        const keys = Object.keys(rootMap).filter(function (key) { return rootMap[key].words.length >= 2; });
        if (!keys.length) {
          return null;
        }
        const dayIndex = Math.floor(Date.now() / 86400000);
        const rootKey = keys[dayIndex % keys.length];
        const item = rootMap[rootKey];
        const primary = item.words[0].parts.find(function (part) { return part.type === "root" && part.text === rootKey; });
        item.meaning = primary ? primary.meaning : "词根";
        item.words = shuffle(item.words).slice(0, 5);
        return item;
      }

      function renderCard(word, showExam) {
        const bookmarkExam = showExam ? (word.examTypes[0] || state.currentExam) : state.currentExam;
        const progress = ensureProgress(bookmarkExam);
        const bookmarked = progress.bookmarks.indexOf(word.id) !== -1;
        const stars = Array.from({ length: 5 }, function (_, index) {
          return '<span style="color:' + (index < word.difficultyLevel ? "var(--amber)" : "var(--line)") + '">★</span>';
        }).join("");
        const examBadge = showExam
          ? '<div class="exam-pill">' + escapeHtml(word.examTypes.join(" / ")) + "</div>"
          : "";
        return '<div class="word-card' + (session.flipped ? " flipped" : "") + '" id="wordCard">' +
          '<div class="card-inner">' +
          '<div class="card-face card-front">' +

      function makeListenOptions(correctWord, exam) {
        const currentPool = wordsForExam(exam).filter(function (word) {
          return word.id !== correctWord.id && word.definitionCn !== correctWord.definitionCn;
        });
        const globalPool = allWords().filter(function (word) {
          return word.id !== correctWord.id && word.definitionCn !== correctWord.definitionCn;
        });
        const distractors = shuffle(currentPool).slice(0, 3);
        if (distractors.length < 3) {
          const seen = {};
          distractors.forEach(function (word) { seen[word.id] = true; });
          globalPool.forEach(function (word) {
            if (distractors.length < 3 && !seen[word.id]) {
              distractors.push(word);
              seen[word.id] = true;
            }
          });
        }
        const options = [{ text: correctWord.definitionCn, correct: true }].concat(
          distractors.slice(0, 3).map(function (word) {
            return { text: word.definitionCn, correct: false };
          })
        );
        return shuffle(options);
      }

      function startListenTimer(word, options) {
        stopListenTimer();
        let timeLeft = 5;
        const timerEl = document.getElementById("listenTimer");
        if (timerEl) {
          timerEl.textContent = String(timeLeft);
        }
        speakWord(word);
        listenTimer = window.setInterval(function () {
          timeLeft -= 1;
          if (timerEl) {
            timerEl.textContent = String(Math.max(0, timeLeft));
          }
          if (timeLeft <= 0) {
            stopListenTimer();
            if (!session.listenAnswered) {
              session.listenAnswered = true;
              recordAttempt(state.currentExam, false);
              addMistake(state.currentExam, word.id);
              const correct = options.find(function (option) { return option.correct; });
              const feedback = document.getElementById("listenFeedback");
              if (feedback) {
                feedback.textContent = "时间到 · 正确答案：" + correct.text;
                feedback.className = "feedback wrong";
              }
              markOptions(correct.text, null);
            }
          }
        }, 1000);
      }

      function stopListenTimer() {

      function getScheduleBoxLabel(wordId) {
        const progress = ensureProgress(state.currentExam);
        const entry = progress.schedule && progress.schedule[wordId];
        if (!entry) {
          return "未安排";
        }
        const names = ["5 分钟", "30 分钟", "12 小时", "1 天", "3 天", "7 天", "14 天", "30 天"];
        return names[entry.box] || "长期";
      }

      function getNextReviewLabel(wordId) {
        const progress = ensureProgress(state.currentExam);
        const entry = progress.schedule && progress.schedule[wordId];
        if (!entry || !entry.next) {
          return "现在";
        }
        const diff = entry.next - Date.now();
        if (diff <= 0) {
          return "现在";
        }
        const minutes = Math.round(diff / 60000);
        if (minutes < 60) {
          return minutes + " 分钟";
        }
        const hours = Math.round(minutes / 60);
        if (hours < 24) {
          return hours + " 小时";
        }
        return Math.round(hours / 24) + " 天";
      }

            '<div class="teacher-panel"><div class="teacher-head"><div><h2 class="teacher-title">本轮检测完成</h2><div class="teacher-sub">检测分数：' + trainingCheckSession.score + ' / ' + total + '</div></div></div>' +
            '<div class="answer-actions">' +
            '<button class="ghost-btn" data-action="back-to-training">回到专属训练</button>' +
            '<button class="primary-btn" data-action="next-training-round">进入下一次专属训练</button>' +
            '</div></div>';
          return;
        }
        trainingCheckSession.answered = false;
        const options = makeListenOptions(word, exam);
        main.innerHTML = '<div class="mode-toolbar"><div class="eyebrow">训练检测 · <strong>' + escapeHtml(exam) + '</strong></div>' +
          '<div class="exam-pill">' + (session.index + 1) + ' / ' + session.queue.length + '</div></div>' +
          '<div class="listen-stage">' +
          '<div class="speak-target"><div class="card-word">' + escapeHtml(word.word) + '</div><div class="card-phonetic">' + escapeHtml(word.phonetic) + '</div></div>' +
          '<div class="listen-options">' + options.map(function (option, index) {
            return '<button class="listen-option" data-training-option="' + index + '">' + escapeHtml(option.text) + '</button>';
          }).join("") + '</div>' +
          '<div class="feedback" id="trainingCheckFeedback"></div>' +
          '<div class="answer-actions"><button class="primary-btn" id="trainingCheckNext">下一题</button></div>' +
          '</div>';
      }

      function handleTrainingCheckAnswer(selectedIndex) {
        if (trainingCheckSession.answered) {
          return;
        }
        const word = currentWord();
        if (!word) {
          return;
        }
        const options = makeListenOptions(word, state.currentExam);
        const correct = options[selectedIndex] && options[selectedIndex].correct;
        trainingCheckSession.answered = true;
        if (correct) {
          trainingCheckSession.score += 1;
        }
        recordAttempt(state.currentExam, correct, word.id, false);
        if (!correct) {
          addMistake(state.currentExam, word.id);
        }
        const buttons = document.querySelectorAll("[data-training-option]");
        buttons.forEach(function (button, index) {
          if (options[index] && options[index].correct) {
            button.classList.add("correct");
          } else if (index === selectedIndex) {
            button.classList.add("wrong");
          }
          button.disabled = true;
        });
        const feedback = document.getElementById("trainingCheckFeedback");
        if (feedback) {
          feedback.textContent = correct ? "回答正确" : "没关系，这个单词会继续进入复习队列。";
          feedback.className = "feedback " + (correct ? "correct" : "wrong");
        }
        persist();
      }

      function bindTrainingCheckEvents() {
        document.querySelectorAll("[data-training-option]").forEach(function (button) {
          button.onclick = function () {
            handleTrainingCheckAnswer(Number(button.dataset.trainingOption));
          };
        });
        const next = document.getElementById("trainingCheckNext");
        if (next) {
          next.onclick = function () {
            if (!trainingCheckSession.answered && currentWord()) {
              showToast("请先选择一个答案");
              return;
            }
            if (session.index < session.queue.length - 1) {
              session.index += 1;
              render();
            } else {
              session.index = session.queue.length;
              render();
            }
          };
        }
        document.querySelectorAll("[data-action='back-to-training']").forEach(function (button) {
          button.onclick = function () {
            state.mode = "training";
            session = createSession();
            render();
            pushNavigation();
          };
        });
        document.querySelectorAll("[data-action='next-training-round']").forEach(function (button) {
          button.onclick = function () {
            state.mode = "teacher";
            state.trainingPlan = null;
            session = createSession();
            persist();
            render();
            pushNavigation();
            showToast("可以生成下一轮专属训练");
          };
        });
      }

      function renderTrainingTask(item, index) {
        const mode = getTrainingModeForTask(item.task);
        return '<div class="training-task">' +
          '<div class="training-task-index">' + (index + 1) + '</div>' +
          '<div class="training-task-main">' +
          '<div class="training-task-title">' + escapeHtml(item.task || "训练任务") + '</div>' +
          '<div class="training-task-meta">' + escapeHtml(item.minutes || 10) + ' 分钟 · ' + escapeHtml(item.focus || "按当前词库训练") + '</div>' +
          '</div>' +
          '<button class="training-start" data-training-mode="' + escapeAttr(mode) + '">开始</button>' +
          '</div>';
      }

      function getTrainingModeForTask(task) {
        const text = String(task || "").toLowerCase();
        if (/(口语|跟读|发音|speak)/.test(text)) {
          return "speaking";
        }
        if (/(听音|听力|listen)/.test(text)) {
          return "listening";
        }
        if (/(默写|拼写|spell)/.test(text)) {
          return "spelling";
        }
        if (/(认识|认词|识记|学习新词|记忆|记单词)/.test(text)) {
          return "preview";
        }
        if (/(复习|错题|遗忘|review)/.test(text)) {
          return "review";
        }
        if (/(预览|浏览|词表|preview)/.test(text)) {
          return "preview";
        }
        return "gallery";
      }

      function sortTrainingTasks(tasks) {
        const order = {
          preview: 0,
          gallery: 1,
          listening: 2,
          spelling: 3,
          speaking: 4,
          review: 5
        };
        return tasks.slice().sort(function (left, right) {
          const leftMode = getTrainingModeForTask(left.task);
          const rightMode = getTrainingModeForTask(right.task);
          return (order[leftMode] || 6) - (order[rightMode] || 6);
        });
      }

      function parseTrainingPlan(raw) {
        let parsed = null;
        try {
          parsed = JSON.parse(String(raw || "").replace(/```json/gi, "").replace(/```/g, "").trim());
        } catch (error) {
          parsed = null;
        }
        return parsed;
      }

      function getTrainingPlanData() {
        if (!state.trainingPlan || !state.trainingPlan.raw) {
          return null;
        }
        return parseTrainingPlan(state.trainingPlan.raw);
      }

      function getTrainingWordQueue() {
        const exam = state.currentExam;
        const limit = Math.max(5, Math.min(200, Number(state.settings.trainingWordCount) || 30));
        const seen = {};
        const queue = [];
        const addWord = function (word) {
          if (word && !seen[word.id]) {
            seen[word.id] = true;
            queue.push(word);
          }
        };
        if (state.trainingPlan && Array.isArray(state.trainingPlan.targetWords)) {
          state.trainingPlan.targetWords.forEach(function (target) {
            const word = allWords().find(function (item) {
              return item.word.toLowerCase() === String(target || "").toLowerCase();
            });
            addWord(word);
          });
        }
        if (queue.length < limit) {
          getDueWords(exam).forEach(addWord);
        }
        if (queue.length < limit) {
          getStudyQueue(exam).forEach(addWord);
        }
        return queue.slice(0, limit);
      }

      function storeTrainingPlan(raw) {
        const parsed = parseTrainingPlan(raw);
        state.trainingPlan = {
          exam: state.currentExam,
          raw: String(raw || ""),
          generatedAt: Date.now(),
          targetWords: parsed && Array.isArray(parsed.target_words) ? parsed.target_words : []
        };
        persist();
      }

      function formatTrainingTime(timestamp) {
        if (!timestamp) {
          return "刚刚";
        }
        const date = new Date(timestamp);
        return (date.getMonth() + 1) + "月" + date.getDate() + "日 " +
          ("0" + date.getHours()).slice(-2) + ":" + ("0" + date.getMinutes()).slice(-2);
      }

      function buildDiagnostics(exam) {
        const words = wordsForExam(exam);
        const progress = ensureProgress(exam);
        const validIds = {};
        words.forEach(function (word) { validIds[word.id] = true; });
        const seenCount = getSeenCount(exam);
        const masteredCount = progress.mastered.filter(function (id) { return validIds[id]; }).length;
        const accuracy = getAccuracy(exam);
        const recentMistakes = shuffle(progress.mistakes.map(function (id) {
          return allWords().find(function (word) { return word.id === id; });
        }).filter(Boolean)).slice(0, 8).map(function (word) { return word.word; });
        const dueCount = getDueCount(exam);
        const rootMap = {};
        words.forEach(function (word) {
          if (progress.mistakes.indexOf(word.id) !== -1) {
            word.roots.forEach(function (root) { rootMap[root] = (rootMap[root] || 0) + 1; });
          }
        });
        const weakRoots = Object.keys(rootMap).sort(function (a, b) { return rootMap[b] - rootMap[a]; }).slice(0, 3);
        const weakness = weakRoots.length ? ("建议集中复习词根：" + weakRoots.join("、")) : "错题还不多，继续扩大输入量。";
        const todayAdvice = dueCount > 0
          ? ("今天有 " + dueCount + " 个词到期，先完成主动复习。")
          : (masteredCount >= 30 ? "掌握情况不错，可以进入口语跟读，把已学词转化为输出。" : "先完成 30 个新词学习，建立今天的记忆锚点。");
        return {
          seenCount: seenCount,
          masteredCount: masteredCount,
          accuracy: accuracy,
          weakness: weakness,
          recentMistakes: recentMistakes.length ? recentMistakes : ["暂无错词"],
          todayAdvice: todayAdvice,
          dueCount: dueCount
        };
      }

              return '<label class="assessment-option" style="cursor:pointer"><input type="checkbox" data-skill="' + escapeAttr(skill) + '"' + (checked ? " checked" : "") + ' /> ' + escapeHtml(skill) + '</label>';
